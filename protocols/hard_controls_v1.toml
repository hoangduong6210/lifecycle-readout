protocol_id = "LCR-P-HARD-001"
status = "prospective-exploratory-controls"
amendment_date = "2026-10-15"
amends = "LCR-P-TKDE-002"
amendment_reason = "Separate lifecycle utility from recurrence information and easy negative discrimination; preserve all earlier outputs."
datasets = ["wikipedia", "reddit"]
seeds = [1, 7, 42]
models = ["base", "base_stats", "scalar_decay", "mlp_gate", "ordered_gate"]
split_chronological = [0.70, 0.15, 0.15]
inductive_unseen_node_ratio = 0.10
split_seed = 42
negative_sampling = "matched_historical"
matching = "same-source; both-candidates-previously-observed; equal-floor-log2-count; equal-floor-log2-one-plus-elapsed-over-1000-seconds"
empty_pool_policy = "skip-supervision-and-retain-event-ID; observe-real-event-for-future-history; no-easy-negative-fallback"
simultaneous_events = "query-all-at-t-before-observing-any-event-at-t"
feature_access = "identical-neighbor-history; base_stats-and-all-gates-share-identical-six-pair-statistics"
training = "independent-from-scratch; same-seed-backbone-initialization; same-batch-order; same-optimizer-and-epoch-budget"
validation_selection = "maximum-pooled-validation-AP; earliest-epoch-tie-break"
primary_endpoint = "pooled-test-AP-on-shared-matched-hard-candidates"
secondary_endpoints = ["AUC", "Brier", "both-candidates-silence-at-least-1000", "held-out-node-strata", "paired-seed-AP-differences"]
interpretation = "conditional-recurrent-support-only; not-first-time-link-generalization; not-real-world-causal-identification"
clock_amendment = "all-decay-models-use-dt-divided-by-fixed-1000-seconds; separate-study-not-replacement-of-earlier-raw-second-model"
publication_eligible = false
