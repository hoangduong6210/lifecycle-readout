protocol_id = "LCR-P-COMPETE-DEV-001"
status = "prospective-exploratory-pilot"
date = "2026-10-16"
relationship = "Separate development design; preserves all prior hard-control and cadence endpoints and outcomes."
datasets = ["wikipedia"]
seeds = [101, 202, 303]
split_chronological = [0.70, 0.15, 0.15]
inductive_unseen_node_ratio = 0.10
negative_sampling = "Existing matched_historical sampler, same split seed, bins, support and no fallback."
history = "All queries before same-timestamp updates; excluded training events absent from all histories, unsupported allowed events included. Validation feature extraction stops at validation end."
profiles = "Strict-past nonnegative destination histograms of hashed source identities, L2 normalized; 32 buckets, fixed seed 17. Behavioral affinity proxy, not verified topic semantics. No corpus-wide embedding fit."
exposure = "Dot current pre-query candidate profile with sum of pre-event competitor destination profiles, for source events strictly after candidate last interaction timestamp and strictly before query. No state from the last timestamp group enters exposure."
features = ["log1p competing source event count", "log1p profile exposure", "candidate profile available", "log1p competitor events with available profiles"]
shuffle = "Fixed permutation of candidate profile coordinates only, leaving competitor coordinates unchanged; preserves norms but breaks coordinate alignment. Not a destination-label permutation."
controls = "Masked MLP; activity/availability MLP masks only profile exposure; profile MLP; coordinate-shuffled profile MLP; activity-displacement; profile-displacement. All reserve ten inputs and exactly equal parameter counts. Both displacement arms receive all profile features."
mechanism = "Additive logit inhibition -max(a,0)*softplus(g(context))*log1p(exposure), activity variant replaces exposure by competitor count. Flexible residual a*g(context). Shared architecture/initialization; amplitude starts zero in every arm. Inhibition amplitude projected nonnegative after each optimizer step."
guarantee = "Partial derivative nonpositive in explicit exposure at fixed context and amplitude. No chronological score certificate: profiles, context and base score can change. Latent exp(-gamma exposure) attenuation motivates bounded state positivity but no latent lifecycle is identified."
objective = "Identical pointwise BCE plus half-weight affinity BCE, as in parent controls; no pairwise-loss change."
primary_endpoint = "Paired selected validation AP: profile_displacement minus profile_mlp, identical available features and parameter count."
secondary_endpoints = ["profile_mlp minus activity_mlp", "profile_mlp minus shuffled_mlp", "activity_mlp minus masked_mlp", "profile_displacement minus activity_displacement", "AUC", "sampled-candidate Brier", "pair accuracy", "coverage", "parameter count", "elapsed time", "amplitude"]
selection = "Ten epochs, earliest maximum validation AP, fixed learning rate/budget for all arms. No tuning or arm dropping after results."
audit = "Direct raw-history reconstruction at eight evenly spaced supported train and eight validation queries per seed. Save all raw features and candidate identities, full validation predictions/checkpoints/history. Source/config/protocol hashed before allocation; independently verify metrics, arm completeness and checkpoint inference after retrieval."
compute = "One owned Colab L4 runtime for this Wikipedia pilot, bounded timeout and artifact retrieval with finally teardown and backend release verification. No heavy local fitting; no automatic expansion to Reddit based on a positive result."
interpretation = "Exploratory validation-selected comparison on previously inspected data. Not fresh confirmation, semantic truth, causal displacement, edge-death labels, survival estimation, novelty clearance, or publication admission."
test_scoring_permitted = false
publication_eligible = false
