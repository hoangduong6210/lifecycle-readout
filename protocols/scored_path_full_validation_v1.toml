primary_endpoint = "Per dataset/seed fraction of all supported validation candidate trajectories with at least one adjacent native-float32 unclipped-score increase above 1e-5, dynamic_transition versus implemented_flow."
secondary_endpoints = ["All four path counts", "outer-clipped probability flags", "float64 derivative flags", "native-versus-float64 flag disagreements", "pointwise certificate error", "largest adjacent increase"]
precision = "Freeze native float32 backbone/encoder/context/affinity for every query; lift only those fixed tensors and a copied lifecycle scorer to float64. Native float32 scores define primary flags. Float64 flags and any disagreements are retained, not used to move the threshold."
history = "Rebuild all selected pre-event neighbors/pair features directly from allowed raw history. Query ties before updates, exclude held-out training events, retain unsupported allowed events in history. Compare all saved selected pair features/elapsed times."
held_fixed = "Same initial states, contextual features, backbone affinity and readout as anchor study; fixed path freezes learned T at observed native anchor time, dynamic path varies explicit normalized elapsed only."
native_check = "For every query compare frozen lifecycle reconstruction with full archived predictor at its observed inputs. Native float32 lifecycle trajectories use the same frozen context; no repeated backbone computation is needed along the artificial grid. Check all float64 trajectory values against native scores at rtol 2e-4, atol 2e-5."
derivative_check = "All grid points use reverse-mode score derivatives and forward-mode state/matrix velocities plus the exact softmax directional identity; exclude exact log-clamp boundaries and retain counts."
compute = "One owned Colab L4 runtime per dataset, sequential, bounded timeout with artifact retrieval and finally teardown/backend release verification. Microbatch fixed by config; no local real-data full-cohort intervention execution."
interpretation = "Complete supported-validation coverage of these trained checkpoints under the fixed-context finite-grid intervention. Not chronological physical silence, universal monotonicity, independent confirmation, an external causal effect or predictive superiority."
