authorization = "Q1 research program: controlled mechanism checks before another large GPU study."
question = "Can a nested monotone residual learn a known time response and stay neutral under a null, and where is its sign restriction misspecified?"
seeds = [11, 29, 47]
scenarios = ["null", "homogeneous_decay", "contextual_decay", "increasing"]
models = ["scalar", "mixture", "flexible"]
base = "Fixed oracle context logit 1+0.4*c; cannot absorb the temporal effect."
context = "Uniform c in [-1,1], independent of uniform elapsed; q receives c only."
generators = "null: base; homogeneous: base-1.8*log1p(t/1.5); contextual: base-(1.2+c)*log1p(t/(1.7-1.3*c)); increasing: base+0.8*log1p(t)."
training_target = "Known Bernoulli probabilities, not sampled binary events; isolates function approximation rather than sampling-noise robustness."
training = "Full-batch expected BCE, equal Adam step and learning-rate budget; no auxiliary loss or phase regularizer; projected residual amplitudes."
selection = "Smallest validation excess expected BCE, earliest exact tie."
primary_endpoint = "Independent same-support test excess expected BCE relative to oracle entropy, averaged over development seeds."
secondary_endpoints = ["probability MSE", "tail-extrapolation excess BCE", "selected-step", "residual-amplitudes", "runtime", "parameter-count"]
interpretation = "Toy scalar response approximation, not temporal graph event recovery, causal discovery, learned lifecycle semantics or an efficacy claim."
thresholds = "Report every outcome without threshold-based publication admission or parameter changes after test inspection."
compute = "Small local CPU diagnostic, one thread, no Colab allocation; larger experiments require Colab."
