protocol_id = "LCR-P-CADENCE-DEV-001"
status = "prospective-implementation-validated-not-allocated"
date = "2026-10-16"
authorization = "User explicitly requested implementation of the pair-specific cadence clock; validation development design is recorded before any allocation."
amends = "LCR-P-Q1-DEV-001"
amendment_reason = "Separate added cadence information from changing the explicit attenuation clock, while preserving sampler, support, architecture family and objectives."
datasets = ["wikipedia", "reddit"]
seeds = [101, 202, 303]
split_chronological = [0.70, 0.15, 0.15]
inductive_unseen_node_ratio = 0.10
split_seed = 42
negative_sampling = "matched_historical"
matching = "Unchanged same-source logarithmic count/silence bins and no fallback."
training_support = "Unchanged supported recurrent cohort; excluded held-out training events enter neither supervision nor history; unsupported allowed events enter history."
history = "Query all candidates at a timestamp before observing allowed events at that timestamp. No test cadence extraction."
cadence = "Arithmetic mean (last-first)/(prior_count-1), available only with count>=2 and positive span; not an EMA."
fallback = "Median available positive cadence among both candidates of supported TRAIN queries only. Fail if no estimable train cadence. Missing and zero-span values retain an availability indicator."
tau0_seconds = 1.0
relative_clock = "log1p(elapsed_seconds/(effective_pair_cadence_seconds+tau0_seconds))"
added_features = ["log1p(effective_cadence/train_fallback_median)", "cadence_available", "relative_clock"]
feature_comparison = "original versus features configurations: same model families, input dimensions, initial parameters and absolute elapsed/train-median clock; original masks the three additional channels to zero while features exposes them. This avoids changing parameter count when testing added information."
clock_comparison = "features versus relative configurations: scalar/mixture residual use identical nine features, parameter counts, initialization, objectives and support, differing only in explicit attenuation clock."
controls = "Base plus history, scalar residual, mixture residual and flexible MLP residual. Base and MLP do not consume the explicit attenuation clock and are not redundantly fit in relative configuration."
configs = ["configs/pair_cadence_original_v1.toml", "configs/pair_cadence_features_v1.toml", "configs/pair_cadence_relative_v1.toml"]
primary_endpoint = "Paired validation AP difference for relative versus absolute scalar residual with identical augmented features."
secondary_endpoints = ["mixture relative-minus-absolute validation AP", "added-information comparison", "flexible MLP comparison", "AUC", "sampled-candidate Brier", "availability coverage", "parameter count", "elapsed time"]
selection = "Ten epochs; earliest maximum validation AP. Same seeds and candidate stream across configurations. No per-model tuning or sampler change."
interpretation = "Validation development on previously inspected datasets; not fresh confirmation, novelty proof, semantic discovery, Cox survival, or global full-model monotonicity."
compute = "After the active CRAFT dependency completes and is audited; one owned Colab runtime at a time with bounded launcher timeout, retrieval and finally teardown. No GPU allocation by this protocol creation."
test_scoring_permitted = false
publication_eligible = false
