schema_version = 1
protocol = "protocols/competition_development_v1.toml"
entry_script = "scripts/train_competition.py"
config_path = "configs/competition_development_v1.toml"
datasets = ["wikipedia"]
seeds = [101, 202, 303]
models = ["masked_mlp", "activity_mlp", "profile_mlp", "shuffled_mlp", "activity_displacement", "profile_displacement"]
split_seed = 42
epochs = 10
batch_size = 256
learning_rate = 0.001
weight_decay = 0.00001
hidden_dim = 128
time_dim = 32
max_neighbors = 20
history_decay = 0.01
hard_time_unit = 1000.0
decay_time_unit = 1000.0
pair_feature_dim = 10
affinity_auxiliary_weight = 0.5
profile_dimensions = 32
profile_seed = 17
oracle_anchors_per_split = 8
cpu_smoke_event_limit = 1000
evaluation_split = "validation"
[compute]
accelerator = "L4"
timeout_seconds = 3600
wall_timeout_seconds = 4200
ephemeral = true
require_cuda = true
